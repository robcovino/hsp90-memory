[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hsp90memory"
version = "0.1.0"
description = "Memory models for two-level single-molecule traces: Hsp90 plasmon-ruler data, aggregated Markov models, and simulation-based inference"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Covino lab" }]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "matplotlib>=3.8",
  "scikit-learn>=1.3",
  "numba>=0.59",
]

[project.optional-dependencies]
sbi = ["torch>=2.1", "sbi>=0.23"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
